<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ประวัติคำสั่งซื้อ - MyShop">
    <title>ประวัติคำสั่งซื้อ — MyShop</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="page-content">
        <section class="section">
            <div class="container" style="max-width: 800px;">
                <div class="text-center fade-in">
                    <h1 class="section-title">📋 ประวัติคำสั่งซื้อ</h1>
                    <p class="section-subtitle">ดูออเดอร์ทั้งหมดของคุณ และรับข้อมูลเข้าสู่ระบบจากแอดมิน</p>
                </div>
                <div id="orders-list" class="fade-in">
                    <div class="loader">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/orders.js"></script>
    <script>
        // Override init to load orders after auth
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => initHistoryPage(), 500);
        });
    </script>
</body>

</html>

<!-- Header Component -->
<header class="header" id="main-header">
  <div class="container">
    <a href="/index.html" class="header-logo">🛍️ MyShop</a>
    
    <nav class="header-nav" id="main-nav">
      <a href="/index.html" data-page="home">หน้าแรก</a>
      <a href="/pages/products.html" data-page="products">สินค้า</a>
      <a href="/pages/promotions.html" data-page="promotions">โปรโมชั่น</a>
      <a href="/pages/reviews.html" data-page="reviews">รีวิว</a>
    </nav>

    <div class="header-actions">
      <!-- Logged out state -->
      <div id="auth-buttons">
        <button class="btn btn-secondary btn-sm" onclick="openAuthModal('login')">เข้าสู่ระบบ</button>
        <button class="btn btn-primary btn-sm" onclick="openAuthModal('register')">สมัครสมาชิก</button>
      </div>

      <!-- Logged in state -->
      <div id="user-menu" class="hidden">
        <div class="header-user" onclick="toggleUserDropdown()">
          <div class="header-user-avatar" id="user-avatar">U</div>
          <span class="header-user-name" id="user-display-name">ผู้ใช้</span>
        </div>
      </div>

      <button class="nav-toggle" id="nav-toggle" onclick="toggleMobileNav()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

<!-- User Dropdown -->
<div id="user-dropdown" class="user-dropdown hidden" style="
  position: fixed;
  top: calc(var(--header-height) + 5px);
  right: 24px;
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2);
  z-index: 250;
  min-width: 200px;
  box-shadow: var(--shadow-lg);
">
  <a href="/pages/history.html" style="
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    color: var(--color-text-secondary);
    border-radius: var(--radius-sm);
    transition: background 0.15s, color 0.15s;
    font-size: var(--text-sm);
  " onmouseover="this.style.background='rgba(255,255,255,0.06)';this.style.color='var(--color-text)'" onmouseout="this.style.background='none';this.style.color='var(--color-text-secondary)'">
    📋 ประวัติคำสั่งซื้อ
  </a>
  <a href="/pages/admin.html" id="admin-link" class="hidden" style="
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    color: var(--color-text-secondary);
    border-radius: var(--radius-sm);
    transition: background 0.15s, color 0.15s;
    font-size: var(--text-sm);
  " onmouseover="this.style.background='rgba(255,255,255,0.06)';this.style.color='var(--color-text)'" onmouseout="this.style.background='none';this.style.color='var(--color-text-secondary)'">
    ⚙️ จัดการแอดมิน
  </a>
  <div style="height:1px;background:var(--color-border);margin:var(--space-2) 0;"></div>
  <button onclick="logoutUser()" style="
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    color: var(--color-danger);
    border-radius: var(--radius-sm);
    transition: background 0.15s;
    font-size: var(--text-sm);
    width: 100%;
    text-align: left;
    cursor: pointer;
    border: none;
    background: none;
  " onmouseover="this.style.background='rgba(231,76,60,0.1)'" onmouseout="this.style.background='none'">
    🚪 ออกจากระบบ
  </button>
</div>

<!-- Auth Modal -->
<div class="modal-backdrop" id="auth-backdrop" onclick="closeAuthModal()"></div>
<div class="modal" id="auth-modal">
  <div class="modal-header">
    <h3 class="modal-title" id="auth-modal-title">เข้าสู่ระบบ</h3>
    <button class="modal-close" onclick="closeAuthModal()">&times;</button>
  </div>

  <div class="auth-tabs">
    <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">เข้าสู่ระบบ</div>
    <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">สมัครสมาชิก</div>
  </div>

  <!-- Login Form -->
  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">อีเมล</label>
      <input type="email" class="form-input" id="login-email" placeholder="กรอกอีเมล" required>
    </div>
    <div class="form-group">
      <label class="form-label">รหัสผ่าน</label>
      <input type="password" class="form-input" id="login-password" placeholder="กรอกรหัสผ่าน" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">เข้าสู่ระบบ</button>
  </form>

  <!-- Register Form -->
  <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
    <div class="form-group">
      <label class="form-label">ชื่อ</label>
      <input type="text" class="form-input" id="register-name" placeholder="กรอกชื่อ" required>
    </div>
    <div class="form-group">
      <label class="form-label">อีเมล</label>
      <input type="email" class="form-input" id="register-email" placeholder="กรอกอีเมล" required>
    </div>
    <div class="form-group">
      <label class="form-label">รหัสผ่าน</label>
      <input type="password" class="form-input" id="register-password" placeholder="กรอกรหัสผ่าน (อย่างน้อย 6 ตัว)" required minlength="6">
    </div>
    <div class="form-group">
      <label class="form-label">ยืนยันรหัสผ่าน</label>
      <input type="password" class="form-input" id="register-confirm" placeholder="กรอกรหัสผ่านอีกครั้ง" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">สมัครสมาชิก</button>
  </form>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>
